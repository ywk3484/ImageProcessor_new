[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subpx"
version = "0.2.0"
description = "Notebook-friendly subpixel image-processing utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["subpx*"]
