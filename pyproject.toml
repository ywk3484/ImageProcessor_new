[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subpx"
version = "0.2.0"
description = "Notebook-friendly subpixel image-processing utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
analysis = [
    "opencv-python>=4.10",
    "scikit-image>=0.24",
    "scipy>=1.14",
    "tifffile>=2024.8.30",
    "matplotlib>=3.9",
    "pillow>=10.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["subpx*"]
